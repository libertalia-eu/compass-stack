[defaults]
roles_path = roles
# Customer files live outside the repository: pass -i <customer>/inventory.yml and --vault-id @prompt.
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
# A connection that sits idle for minutes (image pull, start of the stack) can lose its path without a notice; the run then waited forever.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
