- name: Add the Docker repository (Debian family)
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Install the tools for the repository key
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true
    - name: Fetch the Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
    - name: Add the Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
        signed_by: /etc/apt/keyrings/docker.asc
    - name: Refresh the package index with the new repository
      ansible.builtin.apt:
        update_cache: true

- name: Add the Docker repository (RedHat family)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.package:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
