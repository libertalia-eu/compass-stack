# Entry of the auth host (REQ-024): the bare address opens the admin console of the realm, everything else goes to Keycloak.
# Keycloak sends the bare address to the console of the realm master, where a Company Admin cannot sign in.
server {
  listen 8080;
  server_tokens off;
  # The address Location carries is relative: nginx would build it from its own scheme and port.
  absolute_redirect off;

  location = / {
    return 302 /admin/libertalia/console/;
  }

  # Docker's resolver, asked again every 5 s: a restarted Keycloak has a new address, nginx must not keep the old one (REQ-040).
  resolver 127.0.0.11 valid=5s;

  location / {
    set $keycloak http://keycloak:8080;
    proxy_pass $keycloak;
    proxy_set_header Host $http_host;
    # Keycloak sets large cookies and headers on the sign-in pages.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
  }
}
